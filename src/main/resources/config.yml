# Prefix: Mesajların başında görünecek yazı
prefix: "&8[&bᴍᴀʀᴋᴇᴛ&8] &7"

# Mesajlar
messages:
  no-permission: "&cʏᴇᴛᴋɪɴ ʏᴏᴋ."
  only-player: "&cʙᴜ ᴋᴏᴍᴜᴛ sᴀᴅᴇᴄᴇ ᴏʏᴜɴᴄᴜ."
  reloaded: "&aᴀʏᴀʀʟᴀʀ ʏᴇɴɪʟᴇɴᴅɪ."
  vault-missing: "&cᴠᴀᴜʟᴛ/ᴇᴄᴏɴᴏᴍʏ ʏᴏᴋ. ᴀʟ/sᴀᴛ ᴋᴀᴘᴀʟɪ."
  not-enough-money: "&cʏᴇᴛᴇʀʟɪ ᴘᴀʀᴀ ʏᴏᴋ."
  not-enough-kristal: "&cʏᴇᴛᴇʀʟɪ ᴋʀɪsᴛᴀʟ ʏᴏᴋ."
  inventory-full: "&cᴇɴᴠᴀɴᴛᴇʀ ᴅᴏʟᴜ."
  bought: "&aᴀʟɪɴᴅɪ: &f%amount%x %item% &8(&c-%price%&8)"
  sold: "&asᴀᴛɪʟᴅɪ: &f%amount%x %item% &8(&a+%price%&8)"
  cannot-sell: "&cʙᴜ ᴜʀᴜɴ sᴀᴛɪʟᴀᴍᴀᴢ."

# Menü dosyaları (plugins/ApeironMarket/menus/)
menus:
  main: "menus/main.yml"
  end: "menus/end.yml"
  nether: "menus/nether.yml"
  totem: "menus/totem.yml"
  biftek: "menus/biftek.yml"
  ametist: "menus/ametist.yml"

