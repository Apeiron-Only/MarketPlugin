# Kristal entegrasyonu (HARICI kristal pluginin icin)
# Bu plugin kristal tutmaz, sadece placeholder okur ve komut cagirir.
kristal:
  placeholder:
    # PlaceholderAPI uzerinden bakiyeyi okumak icin
    balance: "%kristal_balance%"
  commands:
    # Konsoldan calistirilir. / koymana gerek yok.
    give: "kristal give %player% %amount%"
    take: "kristal take %player% %amount%"

# Satin alma menusu gorunumu (tamamen ayarlanabilir)
ui:
  purchase:
    filler:
      enabled: false
      material: "GRAY_STAINED_GLASS_PANE"
      name: " "

# Satın alma menüsü davranışları
purchase:
  # Shift + sol tık ile "mümkün olan maksimum" satın alımda envanter kapasitesi dikkate alınsın mı?
  shift-buy-check-inventory: true
  # Shift + sağ tık ile "hepsini sat" işleminde item sayımı hangi mantıkla olsun?
  # MATERIAL: sadece material eşleşmesi
  # SIMILAR: isim/lore dahil ItemStack#isSimilar
  shift-sell-count-mode: "MATERIAL"

# Stack menüsü (49. slot zümrüt)
stack-menu:
  enabled: true
  # STACKS: 1-7 seçenekleri quantity = (seçim * 64)
  # ITEMS: 1-7 seçenekleri quantity = (seçim)
  mode: "STACKS"
  # Dış çerçeve camı
  frame:
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "
